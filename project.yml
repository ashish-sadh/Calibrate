name: Drift
options:
  bundleIdPrefix: com.drift
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

schemes:
  Drift:
    build:
      targets:
        Drift: all
        DriftTests: [test]
    test:
      targets:
        - DriftTests
  DriftLLMEvalMacOS:
    build:
      targets:
        DriftLLMEvalMacOS: all
    test:
      targets:
        - DriftLLMEvalMacOS
      # Tier-4 env-gated evals (BriefNarratorGroundingEval #885, USDAFallbackEval, ChatLatencyBenchmark)
      # read these via ProcessInfo. On Xcode 13+ a shell env var on `xcodebuild test` does NOT reach
      # the macOS test host, so the gate is wired through a build-setting reference: it expands to ""
      # (→ XCTSkip, the CI default) unless the run explicitly passes e.g. `DRIFT_DEEP_EVAL=1` as a
      # build setting on the xcodebuild command line. Keeps the long evals off CI / the commit path.
      environmentVariables:
        - variable: DRIFT_DEEP_EVAL
          value: $(DRIFT_DEEP_EVAL)
          isEnabled: true
        - variable: DRIFT_USDA_EVAL
          value: $(DRIFT_USDA_EVAL)
          isEnabled: true
        - variable: DRIFT_LATENCY_BENCH
          value: $(DRIFT_LATENCY_BENCH)
          isEnabled: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  DriftCore:
    path: DriftCore

targets:
  Drift:
    type: application
    platform: iOS
    sources:
      - path: Drift
        # Archived/dead code preserved for reference but NOT compiled
        # (e.g. legacy chat BYOK path superseded by the Nebius team-key coach).
        excludes:
          - "Archive"
          # Pose photo pack (#929) — bundled via the folder reference below,
          # not compiled sources.
          - "ExercisePoses"
      # Exercise pose pack (free-exercise-db, public domain — see
      # scripts/ingest-exercise-poses.sh). Folder reference with a resources
      # build phase: ships as an "ExercisePoses/" bundle subdirectory, one
      # pbxproj entry for ~1.7k HEICs instead of flattening the bundle root.
      - path: Drift/ExercisePoses
        type: folder
        buildPhase: resources
      # Cross-platform UI shared with the Android app (drift-android symlinks
      # this same directory into its module) — ONE file builds for both.
      - path: SharedUI
    resources:
      - path: Drift/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drift.health
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 368
        SWIFT_VERSION: "6.0"
        # SharedUI/ compiles in three configurations: this app, the Skip
        # module's Android pass, AND its Darwin (iOS) bridging pass. Platform
        # #ifs can't isolate "the Drift app with its app-target views", so
        # SharedUI gates app-only references (e.g. MuscleHighlightCard) on
        # this condition.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DRIFT_IOS_APP"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Drift/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Drift
        CODE_SIGN_ENTITLEMENTS: Drift/Drift.entitlements
        DEVELOPMENT_TEAM: ZJ5H5XH82A
    dependencies:
      - package: GRDB
      - package: DriftCore
      - framework: Frameworks/llama.xcframework
        embed: true
      - target: DriftWidget
        embed: true

    entitlements:
      path: Drift/Drift.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups:
          - group.com.drift.health
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.drift.health
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.drift.health

  DriftWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DriftWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drift.health.widget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 368
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: DriftWidget/Info.plist
        DEVELOPMENT_TEAM: ZJ5H5XH82A
        CODE_SIGN_ENTITLEMENTS: DriftWidget/DriftWidget.entitlements
    entitlements:
      path: DriftWidget/DriftWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.drift.health

  DriftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DriftTests
        excludes:
          - "LLMEval"
    dependencies:
      - target: Drift
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

  DriftLLMEvalMacOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DriftLLMEvalMacOS
    dependencies:
      - framework: Frameworks/llama.xcframework
      - package: DriftCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
