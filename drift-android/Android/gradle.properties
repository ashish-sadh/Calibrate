org.gradle.jvmargs=-Xmx6g
android.useAndroidX=true
kotlin.code.style=official
# The Kotlin daemon compiles in its OWN JVM, so org.gradle.jvmargs above does
# not apply to it. Without this, :skipstone:SkipUI:compileReleaseKotlin OOMs —
# release-only, because -O/-wmo needs far more headroom than debug's -Onone.
# That is the "publish dies in seconds with no .swift error" signature.
kotlin.daemon.jvmargs=-Xmx6g
